<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>ESP32 Presence</title>

<style>
body {
    font-family: sans-serif;
    background: #111;
    color: #fff;
    text-align: center;
}

.box {
    border: 1px solid #444;
    border-radius: 10px;
    padding: 20px;
    margin: 20px auto;
    width: 320px;
}

button {
    padding: 10px;
    margin: 5px;
    font-size: 16px;
}
#commentInput {
    font-size: 16px;
    width: 90%;
}
</style>

</head>

<body>

<h1>ESP32 Presence</h1>

<div class="box">
    <h2>Status</h2>
    <div id="status">--</div>
    <div id="comment"></div>
    <div id="hostname"></div>
    <div id="ipv4"></div>
    <div id="ipv6"></div>
    <div id="rssi"></div>
    <div id="uptime"></div>
</div>

<div class="box">
    <h2>Set Status</h2>
    <button onclick="setStatus(STATUS_ONLINE)">在席中</button>
    <button onclick="setStatus(STATUS_AWAY)">退席中</button>
    <button onclick="setStatus(STATUS_BUSY)">移動中</button>
<input
    type="text"
    id="commentInput"
    maxlength="120"
    placeholder="コメントを入力">
</div>
<script>

const STATUS_ONLINE = 1;
const STATUS_AWAY   = 2;
const STATUS_BUSY   = 3;
let currentStatus = 0;

const statusText = [
    "待機中",
    "在席中",
    "退席中",
    "移動中"
];

/* ===== 取得 ===== */
async function fetchState() {
    try {
        const res = await fetch('/state');
        const data = await res.json();

        currentStatus = data.status;

        document.getElementById('status').textContent =
            "Status: " + (statusText[data.status] ?? "不明");

        document.getElementById("comment").textContent =
            "Comment:" + data.comment;

        document.getElementById('hostname').textContent =
            "Host: " + data.hostname;

        document.getElementById('ipv4').textContent =
            "IPv4: " + data.ipv4;

        document.getElementById('ipv6').textContent =
            "IPv6: " + data.ipv6;

        document.getElementById('rssi').textContent =
            "RSSI: " + data.rssi;

        document.getElementById('uptime').textContent =
            "Uptime: " + data.uptime + "s";

        /* コメント編集中でなければ同期 */
        if (document.activeElement !==
            document.getElementById("commentInput"))
        {
            document.getElementById("commentInput").value =
                data.comment ?? "";
        }

    } catch (e) {
        console.error("fetch error", e);
    }
}

/* ===== 変更 ===== */
async function setStatus(status) {
    currentStatus = status;
    try {
        await fetch('/state', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                status: status,
                comment:
                    document.getElementById(
                        "commentInput").value
            })

        });

        fetchState();

    } catch (e) {
        console.error("post error", e);
    }
}

async function updateComment()
{
    try {
        await fetch('/state', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                status: currentStatus,
                comment:
                    document.getElementById(
                        "commentInput").value
            })
        });

        fetchState();

    } catch (e) {
        console.error("comment error", e);
    }
}

/* =====  ===== */
setInterval(fetchState, 2000);

/*  */
fetchState();

document.getElementById("commentInput")
    .addEventListener(
        "keydown",
        function(e)
        {
            if (e.key === "Enter")
            {
                e.preventDefault();
                updateComment();
            }
        }
    );

</script>

</body>
</html>
